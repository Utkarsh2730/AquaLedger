# Amplify Hosting build: deploys the backend for this branch, then builds the static site against it.
version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
    build:
      commands:
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        # creates/updates the branch's backend (Cognito, AppSync, DynamoDB, Lambdas, SNS, schedule)
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        # the site must point at this branch's backend, not a placeholder
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
